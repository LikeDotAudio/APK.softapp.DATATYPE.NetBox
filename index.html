<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetBox DCIM Synchronizer & Exporter — APK.audio</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #0f1218; color: #e2e8f0; margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #283348; padding-bottom: 15px; margin-bottom: 20px; }
    textarea { width: 100%; height: 260px; background: #181d28; color: #34d399; font-family: monospace; font-size: 13px; border: 1px solid #2c364a; border-radius: 6px; padding: 12px; margin-bottom: 16px; }
    button { background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h2>🌐 NetBox DCIM Synch & Exporter</h2>
    <button id="btn-dl">Export Cables CSV</button>
  </header>

  <h4 style="color:#94a3b8;">NetBox Cables CSV Export:</h4>
  <textarea id="cable-csv" spellcheck="false"></textarea>

  <h4 style="color:#94a3b8;">NetBox Devices CSV Export:</h4>
  <textarea id="device-csv" spellcheck="false"></textarea>

  <script type="module">
    import { exportNetboxCableCsv, exportNetboxDeviceCsv } from './js/netbox.js';

    const devices = [
      { name: 'CORE-DSP-01', deviceType: 'Audio DSP', role: 'Processor', site: 'Studio A', rack: 'RACK-01', position: 10 },
      { name: 'SW-CORE-01', deviceType: 'Cisco CBS350', role: 'Switch', site: 'Studio A', rack: 'RACK-01', position: 22 }
    ];

    const cables = [
      { fromDevice: 'CORE-DSP-01', fromPort: 'Dante Pri', toDevice: 'SW-CORE-01', toPort: 'ge-0/0/1', label: 'C-DANTE-01' },
      { fromDevice: 'CORE-DSP-01', fromPort: 'Dante Sec', toDevice: 'SW-CORE-01', toPort: 'ge-0/0/2', label: 'C-DANTE-02' }
    ];

    document.getElementById('cable-csv').value = exportNetboxCableCsv(cables);
    document.getElementById('device-csv').value = exportNetboxDeviceCsv(devices);

    document.getElementById('btn-dl').addEventListener('click', () => {
      const blob = new Blob([document.getElementById('cable-csv').value], { type: 'text/csv' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'netbox-cables-export.csv';
      a.click();
    });
  </script>
</body>
</html>
